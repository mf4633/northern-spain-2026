<title>Atelier Figure</title>
<style>
  :root {
    --bg: #ece7df;
    --ink: #221f1c;
    --ink-soft: #6c655c;
    --line: #cbc2b4;
    --panel: rgba(255, 252, 247, 0.82);
    --accent: #1b2a4a;
    --accent-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a;
      --ink: #efe9e0;
      --ink-soft: #9b948b;
      --line: #35323a;
      --panel: rgba(28, 27, 32, 0.84);
      --accent: #7fa3d8;
      --accent-ink: #17161a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17161a;
    --ink: #efe9e0;
    --ink-soft: #9b948b;
    --line: #35323a;
    --panel: rgba(28, 27, 32, 0.84);
    --accent: #7fa3d8;
    --accent-ink: #17161a;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Karla", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
  }
  .hud h1 {
    margin: 0;
    font-family: "Bodoni Moda", "Didot", "Times New Roman", serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 3.5vw, 2.4rem);
    letter-spacing: 0.01em; line-height: 1;
    text-wrap: balance;
  }
  .hud p { margin: 6px 0 0; color: var(--ink-soft); font-size: 0.85rem; max-width: 36ch; }
  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-family: "Bodoni Moda", "Didot", serif; font-size: 1.1rem; letter-spacing: 0.04em;
    color: var(--ink-soft); pointer-events: none; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .panel {
    position: absolute; left: 16px; right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    padding: 12px 14px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px 20px; max-width: 760px; margin: 0 auto;
  }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; outline-offset: 2px; }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .sw:focus-visible { outline: 2px solid var(--accent); }
  .toggles { display: flex; gap: 8px; flex-wrap: wrap; }
  .tg { font: inherit; font-size: 0.8rem; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer; }
  .tg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 0.72rem; color: var(--ink-soft); text-align: right; pointer-events: none; }
  @media (max-width: 560px) { .hint, .hud p { display: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500&family=Karla:wght@400;500&display=swap">

<div id="stage"></div>
<div class="hud">
  <div>
    <h1>Atelier Figure</h1>
    <p>A pole vaulter sculpted as one continuous surface from a blended distance field, pole planted, on a turntable.</p>
  </div>
</div>
<div class="hint">drag to orbit · scroll or pinch to zoom<br>zoom out to see the full 4.3 m pole</div>
<div id="status">Sculpting… 0%</div>

<div class="panel" role="group" aria-label="Figure options">
  <div class="group"><span class="label">Kit</span><div class="swatches" id="kitSw"></div></div>
  <div class="group"><span class="label">Hair</span><div class="swatches" id="hairSw"></div></div>
  <div class="group"><span class="label">Skin</span><div class="swatches" id="skinSw"></div></div>
  <div class="group"><span class="label">Eyes</span><div class="swatches" id="eyeSw"></div></div>
  <div class="group"><span class="label">View</span>
    <div class="toggles">
      <button class="tg" id="spinBtn" aria-pressed="true">Turntable</button>
      <button class="tg" id="poleBtn" aria-pressed="true">Pole</button>
      <button class="tg" id="wireBtn" aria-pressed="false">Wireframe</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');
  const root = document.documentElement.dataset.theme;
  const dark = root === 'dark' || (root !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);

  // ======================= renderer / scene =======================
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(dark ? 0x17161a : 0xece7df);
  scene.fog = new THREE.Fog(scene.background, 6, 16);
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);

  // Image-based lighting: a small studio of soft emissive panels baked to a PMREM
  (function studioEnvironment() {
    const env = new THREE.Scene();
    env.background = new THREE.Color(dark ? 0x2a282e : 0x8d8a86);
    function panel(color, intensity, w, h, pos, look) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
      m.position.set(...pos); m.lookAt(new THREE.Vector3(...look)); env.add(m);
    }
    panel(0xfff3e2, 3.0, 4, 6, [4, 4, 5], [0, 1, 0]);
    panel(0xdde6ff, 1.2, 6, 4, [-6, 3, 2], [0, 1, 0]);
    panel(0xffffff, 2.0, 3, 5, [-2, 3, -6], [0, 1, 0]);
    panel(0x6c6660, 1.0, 20, 20, [0, -5, 0], [0, 0, 0]);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.04).texture;
    pmrem.dispose();
  })();

  scene.add(new THREE.HemisphereLight(dark ? 0x8f95ad : 0xfff4e6, dark ? 0x1a1820 : 0x8a7a68, 0.25));
  const key = new THREE.SpotLight(0xfff1e0, 1.1, 0, Math.PI / 5, 0.6, 1);
  key.position.set(2.4, 4.4, 2.8);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0003;
  key.shadow.radius = 4;
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.45);
  rim.position.set(-1.5, 3, -3);
  scene.add(rim);

  // ======================= materials =======================
  const skinMat = new THREE.MeshPhysicalMaterial({
    color: 0xd9a98a, roughness: 0.52, metalness: 0,
    clearcoat: 0.12, clearcoatRoughness: 0.55,
    sheen: new THREE.Color(0x6a2c26),
    envMapIntensity: 0.7, vertexColors: true
  });
  const kitMat = new THREE.MeshPhysicalMaterial({ color: 0x1b2a4a, roughness: 0.62, metalness: 0, sheen: new THREE.Color(0x2b3550), envMapIntensity: 0.8 });
  const hairMat = new THREE.MeshPhysicalMaterial({ color: 0x6b3a1e, roughness: 0.5, metalness: 0.08, clearcoat: 0.15, clearcoatRoughness: 0.5, envMapIntensity: 0.9 });
  const lipMat = new THREE.MeshPhysicalMaterial({ color: 0xb8767a, roughness: 0.45, clearcoat: 0.25, clearcoatRoughness: 0.4 });
  const shoeMat = new THREE.MeshPhysicalMaterial({ color: 0x1b2a4a, roughness: 0.5, metalness: 0.05, clearcoat: 0.2, clearcoatRoughness: 0.4 });
  const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xf2f0ec, roughness: 0.55, metalness: 0 });
  const scleraMat = new THREE.MeshPhysicalMaterial({ color: 0xf2eee9, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.1 });
  const irisMat = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.35, metalness: 0.1 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x08080a, roughness: 0.3 });
  const poleMat = new THREE.MeshPhysicalMaterial({ color: 0x9fb4c7, roughness: 0.25, metalness: 0.1, clearcoat: 0.9, clearcoatRoughness: 0.15 });
  const tapeMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2e, roughness: 0.85 });
  // Procedural micro-surface: perturb the shading normal with object-space value noise so skin and fabric
  // stop reading as smooth plastic. Object space keeps the pattern fixed to the mesh as the turntable spins.
  function microSurface(mat, amp, scale, roughVar) {
    mat.onBeforeCompile = shader => {
      shader.uniforms.uAmp = { value: amp };
      shader.uniforms.uScale = { value: scale };
      shader.uniforms.uRough = { value: roughVar };
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vObj;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObj = transformed;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
varying vec3 vObj;
uniform float uAmp, uScale, uRough;
float hash3(vec3 p) { p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 p) {
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { return vnoise(p) * 0.55 + vnoise(p * 2.7 + 11.0) * 0.3 + vnoise(p * 7.1 + 5.0) * 0.15; }`)
        .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
{
  vec3 p = vObj * uScale; float e = 0.35;
  vec3 g = vec3(fbm(p + vec3(e,0,0)) - fbm(p - vec3(e,0,0)), fbm(p + vec3(0,e,0)) - fbm(p - vec3(0,e,0)), fbm(p + vec3(0,0,e)) - fbm(p - vec3(0,0,e))) / (2.0 * e);
  g -= dot(g, normal) * normal;
  normal = normalize(normal + uAmp * g);
}`)
        .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
roughnessFactor = clamp(roughnessFactor + uRough * (fbm(vObj * uScale * 0.6 + 3.0) - 0.5), 0.05, 1.0);`);
    };
  }
  microSurface(skinMat, 0.05, 90.0, 0.25);
  microSurface(kitMat, 0.35, 420.0, 0.15);
  microSurface(hairMat, 0.22, 160.0, 0.15);
  microSurface(shoeMat, 0.15, 300.0, 0.1);
  microSurface(whiteMat, 0.3, 500.0, 0.2);
  const bodyMats = [skinMat, kitMat, hairMat, lipMat, shoeMat, whiteMat]; // index == material id from the field
  const allMats = bodyMats.concat([scleraMat, irisMat, pupilMat, poleMat, tapeMat]);

  const figure = new THREE.Group();
  scene.add(figure);

  // ======================= distance-field sculpt =======================
  // Rendered groups: 0 skin, 1 kit, 2 hair, 3 lips, 4 shoe, 5 white (socks, soles).
  // Internal groups: 6 upper core (the crop top is offset from it), 7 lower core (the briefs).
  const SKIN = 0, KIT = 1, HAIR = 2, LIPS = 3, SHOE = 4, WHITE = 5, CORE_TOP = 6, CORE_BOT = 7;
  const NG = 8;
  const prims = [], subs = [];

  function rotInv(rot) {
    if (!rot) return null;
    const m = new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(rot[0] || 0, rot[1] || 0, rot[2] || 0));
    return new THREE.Matrix3().setFromMatrix4(m).transpose().elements;
  }
  // ellipsoid: c centre, r radii, k blend radius, rot euler [x,y,z], core = internal group it also feeds
  function ell(g, c, r, k, rot, core) {
    const R = Math.max(r[0], r[1], r[2]), pad = R + k + 0.03;
    prims.push({ t: 0, g, core: core === undefined ? -1 : core, k, c, r, m: rotInv(rot),
      bb: [c[0] - pad, c[0] + pad, c[1] - pad, c[1] + pad, c[2] - pad, c[2] + pad] });
  }
  function cap(g, a, b, ra, rb, k, core) {
    const R = Math.max(ra, rb), pad = R + k + 0.03;
    prims.push({ t: 1, g, core: core === undefined ? -1 : core, k, a, b, ra, rb,
      bb: [Math.min(a[0], b[0]) - pad, Math.max(a[0], b[0]) + pad, Math.min(a[1], b[1]) - pad, Math.max(a[1], b[1]) + pad, Math.min(a[2], b[2]) - pad, Math.max(a[2], b[2]) + pad] });
  }
  function chain(g, pts, r0, r1, k) { // capsule chain with linearly tapering radius
    for (let i = 0; i < pts.length - 1; i++) {
      const ra = r0 + (r1 - r0) * i / (pts.length - 1), rb = r0 + (r1 - r0) * (i + 1) / (pts.length - 1);
      cap(g, pts[i], pts[i + 1], ra, rb, k);
    }
  }
  function carve(c, r, k, rot) { // ellipsoidal subtraction from the skin
    subs.push({ t: 0, c, r: Array.isArray(r) ? r : [r, r, r], k, m: rotInv(rot) });
  }

  // ---------- head ----------
  ell(SKIN, [0, 1.624, 0.0], [0.078, 0.103, 0.09], 0.02);            // cranium
  ell(SKIN, [0, 1.644, -0.022], [0.08, 0.086, 0.086], 0.02);         // back of skull
  ell(SKIN, [0, 1.552, 0.02], [0.05, 0.04, 0.06], 0.02);             // jaw
  ell(SKIN, [0, 1.518, 0.06], [0.027, 0.018, 0.02], 0.012);          // chin
  ell(SKIN, [-0.05, 1.592, 0.048], [0.022, 0.018, 0.022], 0.035);    // cheekbones
  ell(SKIN, [0.05, 1.592, 0.048], [0.022, 0.018, 0.022], 0.035);
  ell(SKIN, [-0.044, 1.578, 0.056], [0.022, 0.02, 0.017], 0.03);     // cheeks
  ell(SKIN, [0.044, 1.578, 0.056], [0.022, 0.02, 0.017], 0.03);
  ell(SKIN, [0, 1.64, 0.078], [0.056, 0.01, 0.016], 0.014);          // brow ridge
  cap(SKIN, [0, 1.628, 0.088], [0, 1.576, 0.1], 0.008, 0.011, 0.012); // nose bridge
  ell(SKIN, [0, 1.567, 0.104], [0.011, 0.01, 0.011], 0.01);          // nose tip
  ell(SKIN, [-0.011, 1.562, 0.095], [0.008, 0.007, 0.008], 0.008);   // nostrils
  ell(SKIN, [0.011, 1.562, 0.095], [0.008, 0.007, 0.008], 0.008);
  ell(SKIN, [-0.075, 1.6, -0.008], [0.01, 0.031, 0.02], 0.01);       // ears
  ell(SKIN, [0.075, 1.6, -0.008], [0.01, 0.031, 0.02], 0.01);
  ell(SKIN, [-0.031, 1.617, 0.08], [0.02, 0.011, 0.009], 0.012);     // eyelid mass over the eyeballs
  ell(SKIN, [0.031, 1.617, 0.08], [0.02, 0.011, 0.009], 0.012);
  carve([-0.031, 1.612, 0.088], [0.0148, 0.0058, 0.013], 0.004, [0, 0, 0.08]);  // almond eye openings
  carve([0.031, 1.612, 0.088], [0.0148, 0.0058, 0.013], 0.004, [0, 0, -0.08]);
  ell(LIPS, [0, 1.5465, 0.086], [0.024, 0.0035, 0.006], 0.004);      // lips
  ell(LIPS, [0, 1.539, 0.085], [0.022, 0.004, 0.006], 0.004);

  // ---------- neck, shoulders, torso: athletic build, weight on the left leg ----------
  cap(SKIN, [0, 1.395, -0.012], [0, 1.535, 0.0], 0.047, 0.043, 0.03);
  cap(SKIN, [0, 1.44, -0.02], [-0.155, 1.39, -0.01], 0.03, 0.042, 0.03);   // trapezius
  cap(SKIN, [0, 1.44, -0.02], [0.155, 1.405, -0.01], 0.03, 0.042, 0.03);
  cap(SKIN, [0, 1.395, 0.045], [-0.14, 1.392, 0.02], 0.008, 0.007, 0.012); // collarbones
  cap(SKIN, [0, 1.395, 0.045], [0.14, 1.405, 0.02], 0.008, 0.007, 0.012);
  ell(SKIN, [-0.16, 1.375, 0], [0.05, 0.058, 0.05], 0.03);                // deltoids
  ell(SKIN, [0.16, 1.392, 0], [0.05, 0.058, 0.05], 0.03);
  ell(SKIN, [0.005, 1.26, -0.005], [0.15, 0.15, 0.10], 0.035, [0, 0, 0.04], CORE_TOP); // ribcage
  ell(SKIN, [0, 1.30, -0.03], [0.165, 0.12, 0.08], 0.035, null, CORE_TOP);            // upper back
  ell(SKIN, [-0.062, 1.235, 0.062], [0.05, 0.046, 0.05], 0.02, null, CORE_TOP);       // bust
  ell(SKIN, [0.062, 1.235, 0.062], [0.05, 0.046, 0.05], 0.02, null, CORE_TOP);
  ell(SKIN, [0.01, 1.08, 0.0], [0.12, 0.10, 0.086], 0.04, null, CORE_TOP);            // waist
  ell(SKIN, [0.01, 1.08, 0.0], [0.12, 0.10, 0.086], 0.04, null, CORE_BOT);
  ell(SKIN, [0.008, 1.0, 0.008], [0.135, 0.09, 0.088], 0.04, null, CORE_BOT);         // lower abdomen
  ell(SKIN, [0, 0.925, 0], [0.165, 0.11, 0.10], 0.04, [0, 0, -0.06], CORE_BOT);        // pelvis
  ell(SKIN, [-0.075, 0.912, -0.064], [0.082, 0.082, 0.08], 0.03, null, CORE_BOT);     // glutes
  ell(SKIN, [0.075, 0.898, -0.064], [0.082, 0.082, 0.08], 0.03, null, CORE_BOT);
  // rectus abdominis, three pairs
  for (const y of [1.16, 1.10, 1.045]) {
    for (const core of [CORE_TOP, CORE_BOT]) {
      ell(SKIN, [-0.028, y, 0.066], [0.028, 0.026, 0.015], 0.02, null, core);
      ell(SKIN, [0.028, y, 0.066], [0.028, 0.026, 0.015], 0.02, null, core);
    }
  }
  for (const core of [CORE_TOP, CORE_BOT]) {                                          // obliques
    ell(SKIN, [-0.085, 1.10, 0.045], [0.03, 0.06, 0.03], 0.03, null, core);
    ell(SKIN, [0.085, 1.10, 0.045], [0.03, 0.06, 0.03], 0.03, null, core);
  }

  // ---------- left arm: hand on hip, fingers forward and down along the hip ----------
  cap(SKIN, [-0.166, 1.375, 0], [-0.36, 1.13, -0.05], 0.042, 0.034, 0.02);
  ell(SKIN, [-0.262, 1.255, -0.01], [0.03, 0.055, 0.026], 0.02);                     // biceps
  ell(SKIN, [-0.36, 1.13, -0.05], [0.034, 0.038, 0.034], 0.015);
  cap(SKIN, [-0.36, 1.13, -0.05], [-0.19, 0.985, 0.04], 0.036, 0.027, 0.02);
  const handStart = prims.length;
  ell(SKIN, [-0.178, 0.94, 0.03], [0.014, 0.045, 0.03], 0.004, [0, 0.3, 0]);          // palm flat on the hip
  [[-0.165, 0.035], [-0.152, 0.05], [-0.137, 0.063], [-0.118, 0.075]].forEach(([bx, bz], i) => {
    cap(SKIN, [bx, 0.905 - 0.002 * i, bz], [bx + 0.022, 0.837 - 0.002 * i, bz + 0.022], 0.0078, 0.0064, 0.004);
  });
  cap(SKIN, [-0.178, 0.955, 0.01], [-0.168, 0.968, -0.04], 0.0085, 0.007, 0.008);   // thumb behind
  const handPrims = prims.slice(handStart);

  // ---------- pole: planted beside her, leaning slightly out ----------
  const poleA = [0.40, 0.0, 0.06], poleB = [0.46, 4.29, 0.0];
  const poleR = 0.017;
  function poleAt(y) { const t = y / poleB[1]; return [poleA[0] + (poleB[0] - poleA[0]) * t, y, poleA[2] + (poleB[2] - poleA[2]) * t]; }

  // ---------- right arm: raised, gripping the pole at shoulder height ----------
  const gripY = 1.45, gc = poleAt(gripY);
  cap(SKIN, [0.166, 1.392, 0], [0.37, 1.17, 0.11], 0.042, 0.034, 0.02);
  ell(SKIN, [0.27, 1.29, 0.07], [0.03, 0.055, 0.028], 0.02);                        // biceps (flexed)
  ell(SKIN, [0.37, 1.17, 0.11], [0.036, 0.04, 0.036], 0.015);
  cap(SKIN, [0.37, 1.17, 0.11], [0.385, 1.415, 0.045], 0.036, 0.027, 0.02);
  ell(SKIN, [gc[0] - poleR - 0.013, gripY + 0.002, gc[2]], [0.013, 0.045, 0.03], 0.012); // palm against the pole
  const R = poleR + 0.0078;
  const ring = (deg, y) => [gc[0] + R * Math.cos(deg * Math.PI / 180), y, gc[2] + R * Math.sin(deg * Math.PI / 180)];
  for (let i = 0; i < 4; i++) {
    const y = 1.474 - 0.016 * i;
    chain(SKIN, [ring(180, y), ring(125, y), ring(70, y), ring(15, y)], 0.0078, 0.0062, 0.006);
  }

        if (it === 3) { const gl = Math.sqrt(g2); px += gx / gl * lift; py += gy / gl * lift; pz += gz / gl * lift; }
      }
      return new THREE.Vector3(px, py, pz);
    }
    // eyes: sclera, iris, pupil; brows and lash lines laid onto the skin
    [-1, 1].forEach(s => {
      const eye = new THREE.Group();
      eye.position.set(s * 0.031, 1.612, 0.0735);
      eye.add(new THREE.Mesh(new THREE.SphereGeometry(0.0125, 32, 24), scleraMat));
      const iris = new THREE.Mesh(new THREE.SphereGeometry(0.0066, 24, 16), irisMat);
      iris.position.z = 0.0106; iris.scale.z = 0.35; eye.add(iris);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.0027, 16, 12), pupilMat);
      pupil.position.z = 0.0123; pupil.scale.z = 0.3; eye.add(pupil);
      eye.rotation.y = s * -0.05;
      figure.add(eye);
      const brow = new THREE.CatmullRomCurve3([
        onSkin(s * 0.012, 1.633, 0.09, 0.0012), onSkin(s * 0.028, 1.638, 0.088, 0.0012),
        onSkin(s * 0.044, 1.639, 0.082, 0.0012), onSkin(s * 0.058, 1.633, 0.07, 0.0012)]);
      const bm = new THREE.Mesh(new THREE.TubeGeometry(brow, 24, 0.0014, 8, false), hairMat);
      bm.scale.set(1, 1, 1); figure.add(bm);
      const lash = new THREE.CatmullRomCurve3([
        onSkin(s * 0.016, 1.6135, 0.095, 0.0004), onSkin(s * 0.026, 1.6195, 0.096, 0.0004),
        onSkin(s * 0.037, 1.6195, 0.094, 0.0004), onSkin(s * 0.046, 1.614, 0.088, 0.0004)]);
      figure.add(new THREE.Mesh(new THREE.TubeGeometry(lash, 20, 0.0009, 6, false), pupilMat));
    });
    // hair elastic at the base of the ponytail
    const tie = new THREE.Mesh(new THREE.TorusGeometry(0.0255, 0.005, 10, 40), tapeMat);
    tie.position.set(0.0084, 1.5885, -0.163);
    tie.lookAt(new THREE.Vector3(0.012, 1.56, -0.19));
    figure.add(tie);
    statusEl.hidden = true;
  }

  // ======================= pole =======================
  const pole = new THREE.Group();
  {
    const a = new THREE.Vector3(...poleA), b = new THREE.Vector3(...poleB);
    const dir = b.clone().sub(a), len = dir.length();
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(poleR, poleR * 0.85, len, 28), poleMat);
    shaft.position.y = len / 2; shaft.castShadow = true; pole.add(shaft);
    const tape = new THREE.Mesh(new THREE.CylinderGeometry(poleR + 0.0025, poleR + 0.0025, 0.75, 28), tapeMat);
    tape.position.y = 1.65; pole.add(tape);                       // grip tape, hand sits at 1.45
    const band = new THREE.Mesh(new THREE.CylinderGeometry(poleR + 0.001, poleR + 0.001, 0.06, 28), new THREE.MeshStandardMaterial({ color: 0xe8b22a, roughness: 0.6 }));
    band.position.y = 3.05; pole.add(band);                        // manufacturer band
    const plug = new THREE.Mesh(new THREE.CylinderGeometry(poleR + 0.004, poleR + 0.001, 0.07, 28), tapeMat);
    plug.position.y = 0.035; pole.add(plug);                       // rubber tip
    pole.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    pole.position.copy(a);
    figure.add(pole);
  }

  // ======================= turntable + floor =======================
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.76, 0.05, 96), new THREE.MeshStandardMaterial({ color: dark ? 0x26242b : 0xd9d1c4, roughness: 0.9 }));
  disc.position.y = -0.025; disc.receiveShadow = true;
  figure.add(disc);
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.74, 0.006, 12, 120), new THREE.MeshStandardMaterial({ color: dark ? 0x7fa3d8 : 0x1b2a4a, roughness: 0.5 }));
  rimRing.rotation.x = Math.PI / 2; rimRing.position.y = 0.004;
  figure.add(rimRing);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 64), new THREE.MeshStandardMaterial({ color: dark ? 0x121116 : 0xe3dcd0, roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.05; floor.receiveShadow = true;
  scene.add(floor);

  // ======================= orbit camera =======================
  const target = new THREE.Vector3(0.05, 0.92, 0);
  let theta = 0.45, phi = 1.3, radius = 4.6;
  let spinning = true;
  window.__setView = (th, ph, r, ty) => { spinning = false; figure.rotation.y = 0; theta = th; phi = ph; radius = r; target.y = ty; }; // used by the screenshot harness
  function placeCamera() {
    phi = Math.min(Math.max(phi, 0.3), 1.56);
    radius = Math.min(Math.max(radius, 0.6), 14);
    camera.position.set(
      target.x + radius * Math.sin(phi) * Math.sin(theta),
      target.y + radius * Math.cos(phi),
      target.z + radius * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
  }
  const el = renderer.domElement;
  const pointers = new Map();
  let lastPinch = 0;
  el.addEventListener('pointerdown', e => { pointers.set(e.pointerId, [e.clientX, e.clientY]); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', e => pointers.delete(e.pointerId));
  el.addEventListener('pointercancel', e => pointers.delete(e.pointerId));
  el.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    if (pointers.size === 1) { theta -= (e.clientX - prev[0]) * 0.008; phi -= (e.clientY - prev[1]) * 0.006; }
    pointers.set(e.pointerId, [e.clientX, e.clientY]);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (lastPinch) radius *= lastPinch / d;
      lastPinch = d;
    } else lastPinch = 0;
  });
  el.addEventListener('wheel', e => { e.preventDefault(); radius *= 1 + Math.sign(e.deltaY) * 0.08; }, { passive: false });

  // ======================= UI =======================
  function swatches(id, colors, mats, initial) {
    const box = document.getElementById(id);
    colors.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'sw'; b.type = 'button'; b.id = id + '-' + i;
      b.style.background = '#' + c.toString(16).padStart(6, '0');
      b.setAttribute('aria-label', 'Colour ' + (i + 1));
      b.setAttribute('aria-pressed', c === initial ? 'true' : 'false');
      b.addEventListener('click', () => {
        mats.forEach(m => m.color.setHex(c));
        box.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      });
      box.appendChild(b);
    });
  }
  swatches('kitSw',  [0x1b2a4a, 0xb32636, 0x111114, 0x1f5a3a, 0x4b2a7a, 0xe0641f], [kitMat, shoeMat], 0x1b2a4a);
  swatches('hairSw', [0x6b3a1e, 0x2a1a14, 0x0f0d0c, 0xb8862f, 0xe4c78e, 0x7a1f2b], [hairMat], 0x6b3a1e);
  swatches('skinSw', [0xf3d9c4, 0xe6bfa1, 0xd9a98a, 0xb8794f, 0x8a5533, 0x5a3520], [skinMat], 0xd9a98a);
  swatches('eyeSw',  [0x4a6b3a, 0x5b3a1e, 0x3f6f9e, 0x6e7a63, 0x2b1d14], [irisMat], 0x4a6b3a);

  const spinBtn = document.getElementById('spinBtn');
  spinBtn.addEventListener('click', () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', String(spinning)); });
  const poleBtn = document.getElementById('poleBtn');
  poleBtn.addEventListener('click', () => { pole.visible = !pole.visible; poleBtn.setAttribute('aria-pressed', String(pole.visible)); });
  const wireBtn = document.getElementById('wireBtn');
  let wire = false;
  wireBtn.addEventListener('click', () => {
    wire = !wire; wireBtn.setAttribute('aria-pressed', String(wire));
    allMats.forEach(m => { m.wireframe = wire; m.needsUpdate = true; });
  });

  // ======================= resize / loop =======================
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    if (spinning && !reduced) figure.rotation.y += dt * 0.3;
    placeCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(() => sample(0, buildFigure), 50);
})();
</script>
